name: C# Core CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-smoke-tests:
    name: Build and smoke test (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify Unity copies match authoritative C# and starter scripts (R-1)
        shell: bash
        run: |
          set -euo pipefail
          for file in src/LittleEmpires.Core/*.cs; do
            name="${file##*/}"
            diff -q "$file" "unity/LittleEmpires/Assets/LittleEmpires/Core/$name"
          done
          for file in unity/starter/Assets/LittleEmpires/Runtime/*.cs; do
            name="${file##*/}"
            diff -q "$file" "unity/LittleEmpires/Assets/LittleEmpires/Runtime/$name"
          done
          for file in unity/starter/Assets/LittleEmpires/Editor/*.cs; do
            name="${file##*/}"
            diff -q "$file" "unity/LittleEmpires/Assets/LittleEmpires/Editor/$name"
          done
          diff -q tests/LittleEmpires.SmokeTests/RoadPathChecks.cs unity/LittleEmpires/Assets/LittleEmpires/Editor/RoadPathChecks.cs
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build core library
        run: dotnet build src/LittleEmpires.Core/LittleEmpires.Core.csproj --configuration Release --warnaserror
      - name: Compile shared core for Unity (.NET Standard 2.1, C# 9)
        run: dotnet build src/LittleEmpires.Core/LittleEmpires.Core.UnityCompatibility.csproj --configuration Release --warnaserror
      - name: Run smoke tests
        run: dotnet run --project tests/LittleEmpires.SmokeTests/LittleEmpires.SmokeTests.csproj --configuration Release
      - name: Build settlement simulator
        run: dotnet build src/LittleEmpires.Simulator/LittleEmpires.Simulator.csproj --configuration Release --warnaserror
      - name: Run eight-season economy scenario
        run: dotnet run --project src/LittleEmpires.Simulator/LittleEmpires.Simulator.csproj --configuration Release --no-build -- 8
      - name: Run eight-season housing and immigration scenario
        run: dotnet run --project src/LittleEmpires.Simulator/LittleEmpires.Simulator.csproj --configuration Release --no-build -- growth 8
      - name: Run eight-season happiness recovery scenario
        run: dotnet run --project src/LittleEmpires.Simulator/LittleEmpires.Simulator.csproj --configuration Release --no-build -- happiness 8
      - name: Run eight-season townhouse upgrade scenario
        run: dotnet run --project src/LittleEmpires.Simulator/LittleEmpires.Simulator.csproj --configuration Release --no-build -- upgrade 8

      - name: Run eight-season strategic economy scenario
        run: dotnet run --project src/LittleEmpires.Simulator/LittleEmpires.Simulator.csproj --configuration Release --no-build -- strategic 8

      - name: Check Three.js demo module syntax
        run: |
          node --check demo/engine.mjs
          node --check demo/main.mjs
          node --check demo/test-engine.mjs
      - name: Verify Three.js game rules against C# benchmarks
        run: node demo/test-engine.mjs
